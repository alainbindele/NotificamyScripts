version: '3.8'

services:
  notification-poller:
    build: .
    container_name: notification-batch-poller
    environment:
      - AWS_REGION=eu-south-1
      # AWS credentials will be picked up from aws configure or IAM roles
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Enable AWS Secrets Manager
      - AWS_SECRETS_ENABLED=true
      - AWS_SECRETS_DB_NAME=notificamy/database-credentials
      # Fallback values for local development (when secrets are disabled)
      - MYSQL_HOST=mysql
      - MYSQL_USER=notifyme
      - MYSQL_PASS=notifyme123
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      # Mount AWS credentials if available
      - ~/.aws:/root/.aws:ro
    networks:
      - notifyme-network

  mysql:
    image: mysql:8.0
    container_name: notifyme-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=NotificamyDB
      - MYSQL_USER=notifyme
      - MYSQL_PASSWORD=notifyme123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - notifyme-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - notifyme-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - notifyme-network

volumes:
  mysql_data:
  grafana_data:

networks:
  notifyme-network:
    driver: bridge