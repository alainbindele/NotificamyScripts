# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable scheduling in tests
scheduling.poller.enabled=false

# Test AWS configuration
aws.region=us-east-1
aws.sqs.queue-url=https://sqs.us-east-1.amazonaws.com/123456789/test-queue.fifo
aws.sqs.batch-size=10

# Test batch configuration
batch.notification-poller.chunk-size=10
batch.notification-poller.skip-limit=5
batch.notification-poller.retry-limit=2
batch.notification-poller.thread-pool-size=2
batch.notification-poller.throttle-limit=2

# Logging
logging.level.com.notifyme=DEBUG
logging.level.org.springframework.batch=DEBUG